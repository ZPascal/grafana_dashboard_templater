name: PR checks

on:
  pull_request:
    branches: [ main ]

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12', '3.13', '3.14' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the requirements
        run: uv pip install --system .

      - name: Execute the unittests
        run: python3 -m unittest discover tests

  lint:
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix:
        python-version: [ '3.10' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the requirements
        run: uv pip install --system ruff

      - name: Execute the linting checks
        run: ruff check .

  coverage:
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      matrix:
        python-version: [ '3.10' ]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the requirements
        run: uv pip install --system . pytest pytest-cov coverage-badge ruff

      - name: Generate the coverage report
        run: export PYTHONPATH=$PWD && pytest --junitxml=pytest.xml --cov=. tests/ | tee pytest-coverage.txt

      - name: Execute the coverage checks
        uses: MishaKav/pytest-coverage-comment@v1.10.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
          hide-badge: true
          create-new-comment: false

      - name: Generate coverage badge
        run: coverage-badge -f -o docs/coverage.svg

      - name: Check changed files
        id: verify-changed-files
        uses: ZPascal/check-changed-files-action@v1
        with:
          checked_location: 'docs'
          git_location: './'

      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --force docs
          git commit -m "Add coverage badge"

      - name: Push changes
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}

  documentation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ '3.9' ]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install the requirements
        run: uv pip install --system pydoc-markdown==4.6.3 mkdocs mkdocs-material

      - name: Clean up old documentation structure
        run: rm -rf docs/content docs/grafana_dashboard_templater.md

      - name: Generate API documentation
        run: "pydoc-markdown --render-toc || echo 'Warning: pydoc-markdown generation failed, continuing with manual docs'"
        continue-on-error: true

      - name: Move API documentation to docs/api
        run: mkdir -p docs/api && mv build/docs/* docs/api/ 2>/dev/null || true
        continue-on-error: true

      - name: Build documentation site
        run: mkdocs build

      - name: Check changed files
        id: verify-changed-files
        uses: ZPascal/check-changed-files-action@v1
        with:
          checked_location: 'docs'
          git_location: './'

      - name: Commit files
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add --force docs
          git commit -m "docs: Add the documentation"

      - name: Push changes
        uses: ad-m/github-push-action@master
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref }}
