[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grafana-dashboard-templater"
version = "1.0.3"
authors = [
    { name = "Pascal Zimmermann", email = "info@theiotstudio.com" },
]
description = "A Grafana dashboard templater"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
]
dependencies = [
    "jinja2",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-cov", "coverage-badge", "pydoc-markdown==4.6.3", "mkdocs", "mkdocs-material"]

[project.urls]
Homepage = "https://github.com/ZPascal/grafana_dashboard_templater"
"Bug Tracker" = "https://github.com/ZPascal/grafana_dashboard_templater/issues"

[tool.setuptools]
packages = ["grafana_dashboard"]

[tool.ruff]
line-length = 120
exclude = ["venv", "tests", ".git"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["B", "C", "D", "E", "F"]
